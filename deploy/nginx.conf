# Lab Bench —— 阿里云 ECS 上的 nginx 配置
#
# 放到 /etc/nginx/conf.d/lab-bench.conf，把 lab.example.edu.cn 换成你的域名。
#
# 重要：中国大陆节点的 ECS 绑域名必须先完成 ICP 备案，否则 80/443 会被拦。
# 备案没下来之前，可以先用 http://<公网IP>:5299 直连 uvicorn 测试，
# 但那样没有 TLS，口令是明文过网络的，不要让学生在上面用真实口令。

upstream lab_bench {
    server 127.0.0.1:5299;
    keepalive 16;
}

# HTTP 一律跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lab.example.edu.cn;

    # Let's Encrypt 续期用；用阿里云免费证书的话这段可以删
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lab.example.edu.cn;

    ssl_certificate     /etc/nginx/ssl/lab-bench.pem;
    ssl_certificate_key /etc/nginx/ssl/lab-bench.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 合同文件最大 30MB，留点余量
    client_max_body_size 40m;

    # 安全头。CSP 由应用下发（server/app.py 里的 CSP 常量），
    # 这里不再重复设置，避免两份策略打架。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # 前端静态文件直接由 nginx 发，不经过 Python
    root /opt/lab-bench;

    location = / {
        try_files /index.html =404;
    }

    location ~* ^/(app|api|i18n)\.js$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /styles.css {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 上传的合同原件绝不通过 nginx 直接暴露：
    # 它们只能经由 /api 走鉴权后读取。
    location /uploads/ {
        return 404;
    }

    location /api/ {
        proxy_pass         http://lab_bench;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # OCR 一份几十页的扫描件可能要跑一两分钟
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 登录接口单独限速，挡住撞库。
    # 应用层还有连错 8 次锁 15 分钟，两层一起用。
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://lab_bench;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# 放进 http {} 块（通常是 /etc/nginx/nginx.conf）：
#   limit_req_zone $binary_remote_addr zone=login:10m rate=12r/m;
